<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Field Day</title>
  <g transform="rotate(-6 62 62)">
    <!-- Hard offset shadow, then the sticker -->
    <rect x="28" y="28" width="80" height="80" rx="18" fill="#111111"/>
    <rect x="22" y="22" width="80" height="80" rx="18" fill="#FFD43B" stroke="#111111" stroke-width="5"/>

    <!-- Form fields: two filled in, the last one with a text cursor -->
    <rect x="34" y="35" width="56" height="15" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="40" y="40.75" width="24" height="3.5" rx="1.75" fill="#2442E0"/>
    <rect x="34" y="56" width="56" height="15" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="40" y="61.75" width="32" height="3.5" rx="1.75" fill="#2442E0"/>
    <rect x="34" y="77" width="32" height="15" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <rect x="40" y="80.5" width="3" height="8" rx="1.5" fill="#111111"/>
  </g>

  <!-- Prize ribbon: a finished form wins the day -->
  <g transform="translate(93 88) rotate(10)" stroke="#111111" stroke-linejoin="round">
    <polygon points="-5,0 5,0 5,22 0,17 -5,22" transform="translate(-6 8) rotate(20)" fill="#2BD67B" stroke-width="3"/>
    <polygon points="-5,0 5,0 5,22 0,17 -5,22" transform="translate(6 8) rotate(-20)" fill="#2BD67B" stroke-width="3"/>
    <polygon points="0.0,-17.0 3.5,-13.0 8.5,-14.7 9.5,-9.5 14.7,-8.5 13.0,-3.5 17.0,0.0 13.0,3.5 14.7,8.5 9.5,9.5 8.5,14.7 3.5,13.0 0.0,17.0 -3.5,13.0 -8.5,14.7 -9.5,9.5 -14.7,8.5 -13.0,3.5 -17.0,0.0 -13.0,-3.5 -14.7,-8.5 -9.5,-9.5 -8.5,-14.7 -3.5,-13.0" fill="#FF6FAE" stroke-width="3.5"/>
    <circle r="9" fill="#FFFFFF" stroke-width="3"/>
    <path d="M-4.5 0.5 L-1.2 4 L4.8 -3.6" fill="none" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
